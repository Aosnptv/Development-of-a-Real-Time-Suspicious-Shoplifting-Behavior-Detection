# กำหนดเส้นทางไปหาโฟลเดอร์ข้อมูล (ใช้ Path สัมพัทธ์)
path: .  # จุดเริ่มต้นคือโฟลเดอร์ที่ไฟล์นี้อยู่
train: images/train  # ตำแหน่งภาพที่ใช้สอน
val: images/valid    # ตำแหน่งภาพที่ใช้สอบ

# กำหนดจำนวนคลาส (มี 4 คลาส)
nc: 4

# ตั้งชื่อคลาส (ต้องเรียงลำดับ 0, 1, 2, 3 ให้เป๊ะตามที่ทำใน CVAT)
names:
  0: person
  1: hand
  2: product
  3: basket